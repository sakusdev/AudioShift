<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AudioShift</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#eee;font-family:system-ui,-apple-system,sans-serif}.app{max-width:960px;margin:auto;padding:22px}.drop{padding:38px;border:2px dashed #505762;border-radius:16px;text-align:center;cursor:pointer;background:#15181d}.drop.over{border-color:#fff;background:#1b1f25}.card{background:#15181d;border:1px solid #292e37;border-radius:14px;padding:16px;margin-top:14px}.row{display:grid;grid-template-columns:75px 1fr 82px;gap:12px;align-items:center;margin:13px 0}input[type=range]{width:100%}output{text-align:right;font-variant-numeric:tabular-nums}button{padding:9px 13px;border-radius:9px;border:1px solid #444;background:#282d35;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:#eee;color:#111}canvas{display:block;width:100%;height:155px;background:#090b0e;border-radius:10px}.status{color:#aab1bc;font-size:13px;margin-top:9px;min-height:18px}audio{width:100%;margin-top:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.hint{color:#7f8792;font-size:12px}@media(max-width:600px){.app{padding:12px}.row{grid-template-columns:58px 1fr 68px}}
</style>
</head>
<body><main class="app">
<h1>🎛 AudioShift</h1>
<div id="drop" class="drop"><b>音声ファイルをドロップ</b><br><small>クリックして選択</small><input id="file" type="file" accept="audio/*" hidden></div>
<div class="card"><canvas id="wave"></canvas><div id="status" class="status">ファイルを読み込んでください</div></div>
<div class="card">
<div class="row"><label>速度</label><input id="speed" type="range" min=".25" max="4" step=".01" value="1"><output id="speedV">1.00×</output></div>
<div class="row"><label>ピッチ</label><input id="pitch" type="range" min="-24" max="24" step=".01" value="0"><output id="pitchV">+0.00 st</output></div>
<div class="row"><label>Fine</label><input id="fine" type="range" min="-100" max="100" step="1" value="0"><output id="fineV">+0 ct</output></div>
<label><input id="tape" type="checkbox"> Tape mode（速度にピッチを追従）</label>
<div style="margin-top:12px"><button id="reset">Reset</button></div>
<p class="hint">通常モードは速度とピッチを独立処理。Granular OLA方式のプレビュー／書き出しです。</p>
</div>
<div class="card">
<div class="buttons"><button id="play" class="primary" disabled>▶ Preview</button><button id="stop" disabled>■ Stop</button><button id="export" disabled>⬇ WAV Export</button></div>
<audio id="native" controls></audio>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let ctx=null,buffer=null,source=null,rendered=null,renderToken=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pitchRatio=()=>Math.pow(2,(+$('pitch').value + +$('fine').value/100)/12);

async function decode(file){
  stop(); rendered=null; $('native').removeAttribute('src');
  $('status').textContent='Reading file…';
  try{
    const bytes=await file.arrayBuffer();
    if(!bytes.byteLength) throw Error('empty file');
    ctx=ctx||new AudioContext();
    if(ctx.state==='suspended') await ctx.resume();
    $('status').textContent='Decoding…';
    buffer=await ctx.decodeAudioData(bytes.slice(0));
    $('status').textContent=`Ready • ${buffer.duration.toFixed(2)} sec • ${buffer.sampleRate} Hz • ${buffer.numberOfChannels}ch`;
    draw(); $('play').disabled=$('export').disabled=false; $('stop').disabled=false;
  }catch(e){console.error(e);buffer=null;$('play').disabled=$('export').disabled=$('stop').disabled=true;$('status').textContent='Decode failed: '+(e.message||'unsupported/corrupt audio')}
}

function draw(){
  if(!buffer)return; const c=$('wave'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;
  c.width=Math.max(1,r.width*d);c.height=155*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
  x.clearRect(0,0,r.width,155);const data=buffer.getChannelData(0),step=Math.max(1,Math.floor(data.length/r.width));
  x.beginPath();
  for(let i=0;i<r.width;i++){let a=i*step,b=Math.min(data.length,a+step),mn=1,mx=-1;for(let j=a;j<b;j++){const v=data[j];if(v<mn)mn=v;if(v>mx)mx=v}x.moveTo(i,77.5+mn*62);x.lineTo(i,77.5+mx*62)}
  x.strokeStyle='#aeb6c0';x.stroke();x.strokeStyle='#30353d';x.beginPath();x.moveTo(0,77.5);x.lineTo(r.width,77.5);x.stroke();
}

function labels(){
  $('speedV').textContent=(+$('speed').value).toFixed(2)+'×';
  $('pitchV').textContent=(+$('pitch').value>=0?'+':'')+(+$('pitch').value).toFixed(2)+' st';
  $('fineV').textContent=(+$('fine').value>=0?'+':'')+$('fine').value+' ct';
  $('pitch').disabled=$('fine').disabled=$('tape').checked;
}

function stop(){if(source){try{source.stop()}catch{}source=null}if(buffer)$('status').textContent=`Ready • ${buffer.duration.toFixed(2)} sec • ${buffer.sampleRate} Hz • ${buffer.numberOfChannels}ch`}

// Lightweight granular overlap-add renderer. The source read head advances at the
// requested tempo while samples inside each grain are read at the requested pitch.
async function renderGranular(){
  if(!buffer)return null;
  const token=++renderToken;
  const speed=+$('speed').value;
  const tape=$('tape').checked;
  const pr=tape?speed:pitchRatio();
  const grainMs=55, hopMs=18;
  const sr=buffer.sampleRate, grain=Math.max(256,Math.round(sr*grainMs/1000));
  const hop=Math.max(64,Math.round(sr*hopMs/1000));
  const outDuration=buffer.duration/speed;
  const outFrames=Math.max(1,Math.ceil(outDuration*sr));
  const out=ctx.createBuffer(buffer.numberOfChannels,outFrames,sr);
  const win=new Float32Array(grain);
  for(let i=0;i<grain;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(grain-1));
  const srcStep=hop*speed;
  const srcChannels=[];for(let ch=0;ch<buffer.numberOfChannels;ch++)srcChannels.push(buffer.getChannelData(ch));
  const dstChannels=[];for(let ch=0;ch<out.numberOfChannels;ch++)dstChannels.push(out.getChannelData(ch));
  const totalGrains=Math.ceil(outFrames/hop);
  for(let g=0;g<totalGrains;g++){
    if(token!==renderToken) return null;
    const outStart=g*hop, srcCenter=g*srcStep;
    for(let i=0;i<grain && outStart+i<outFrames;i++){
      const srcPos=srcCenter+(i-grain/2)*pr;
      if(srcPos<0 || srcPos>=buffer.length-1) continue;
      const k=srcPos|0, f=srcPos-k, w=win[i];
      for(let ch=0;ch<dstChannels.length;ch++){
        const s=srcChannels[ch]; dstChannels[ch][outStart+i]+=(s[k]*(1-f)+s[k+1]*f)*w;
      }
    }
    if((g&31)===0){$('status').textContent=`Rendering… ${Math.min(100,Math.round(g/totalGrains*100))}%`;await new Promise(requestAnimationFrame)}
  }
  // Normalize overlap gain conservatively.
  const gain=0.82;
  for(const ch of dstChannels)for(let i=0;i<ch.length;i++)ch[i]*=gain;
  if(token!==renderToken)return null;
  rendered=out;$('status').textContent=`Rendered • ${out.duration.toFixed(2)} sec`;
  return out;
}

async function preview(){
  if(!buffer)return;stop();
  const b=await renderGranular();if(!b)return;
  source=ctx.createBufferSource();source.buffer=b;source.connect(ctx.destination);source.onended=()=>{if(source){source=null;if(buffer)$('status').textContent=`Rendered • ${b.duration.toFixed(2)} sec`}};source.start();$('status').textContent='Playing rendered audio…';
}

function audioBufferToWav(b){
  const channels=b.numberOfChannels,sr=b.sampleRate,frames=b.length,bytes=2,ab=new ArrayBuffer(44+frames*channels*bytes),v=new DataView(ab);let o=0;
  const w=(s)=>{for(let i=0;i<s.length;i++)v.setUint8(o++,s.charCodeAt(i))};const u16=x=>{v.setUint16(o,x,true);o+=2};const u32=x=>{v.setUint32(o,x,true);o+=4};
  w('RIFF');u32(36+frames*channels*2);w('WAVE');w('fmt ');u32(16);u16(1);u16(channels);u32(sr);u32(sr*channels*2);u16(channels*2);u16(16);w('data');u32(frames*channels*2);
  for(let i=0;i<frames;i++)for(let ch=0;ch<channels;ch++){const x=clamp(b.getChannelData(ch)[i],-1,1);v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return new Blob([ab],{type:'audio/wav'});
}

async function exportWav(){
  if(!buffer)return; $('export').disabled=true;const b=await renderGranular();if(!b){$('export').disabled=false;return}
  const url=URL.createObjectURL(audioBufferToWav(b));$('native').src=url;$('native').load();
  const a=document.createElement('a');a.href=url;a.download='AudioShift.wav';a.click();$('export').disabled=false;$('status').textContent=`Exported • ${b.duration.toFixed(2)} sec`;
}

$('drop').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&decode(e.target.files[0]);
['dragenter','dragover'].forEach(v=>$('drop').addEventListener(v,e=>{e.preventDefault();$('drop').classList.add('over')}));
['dragleave','drop'].forEach(v=>$('drop').addEventListener(v,e=>{e.preventDefault();$('drop').classList.remove('over')}));
$('drop').ondrop=e=>{const f=e.dataTransfer.files[0];if(f)decode(f)};
$('play').onclick=preview;$('stop').onclick=stop;$('export').onclick=exportWav;
['speed','pitch','fine','tape'].forEach(id=>$(id).oninput=labels);
$('reset').onclick=()=>{$('speed').value=1;$('pitch').value=0;$('fine').value=0;$('tape').checked=false;labels()};
addEventListener('resize',draw);labels();
</script></body></html>
