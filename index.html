<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudioShift</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1000px;margin:auto;padding:18px}.drop,.card{background:#15181d;border:1px solid #292e37;border-radius:14px}.drop{padding:34px;border:2px dashed #505762;text-align:center;cursor:pointer}.drop.over{border-color:#fff;background:#1b1f25}.card{padding:15px;margin-top:12px}.row{display:grid;grid-template-columns:85px 1fr 80px;gap:11px;align-items:center;margin:10px 0}input[type=range]{width:100%}output{text-align:right;font-variant-numeric:tabular-nums}button,select{padding:8px 11px;border-radius:9px;border:1px solid #444;background:#282d35;color:#fff}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#eee;color:#111}.buttons,.pitchBtns{display:flex;gap:6px;flex-wrap:wrap}.pitchBtns button{min-width:44px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}canvas{display:block;width:100%;height:155px;background:#090b0e;border-radius:10px}.status,.small,.hint{color:#9aa2ad;font-size:12px}.meter{height:4px;background:#252a31;border-radius:9px;overflow:hidden;margin-top:7px}.meter i{display:block;height:100%;width:0;background:#bbb}@media(max-width:680px){.app{padding:10px}.row{grid-template-columns:62px 1fr 68px}.grid2{grid-template-columns:1fr}}
</style></head><body><main class="app">
<h1>🎛 AudioShift <small style="font-size:12px;color:#999">Realtime Preview</small></h1>
<div id="drop" class="drop"><b>音声ファイルをドロップ</b><br><small>クリックして選択</small><input id="file" type="file" accept="audio/*" hidden></div>
<div class="card"><canvas id="wave"></canvas><div id="status" class="status">ファイルを読み込んでください</div><div class="meter"><i id="progress"></i></div></div>
<div class="card"><b>Time / Pitch</b>
<div class="row"><label>速度</label><input id="speed" type="range" min=".25" max="4" step=".01" value="1"><output id="speedV">1.00×</output></div>
<div class="row"><label>ピッチ</label><input id="pitch" type="range" min="-24" max="24" step=".01" value="0"><output id="pitchV">+0.00 st</output></div>
<div class="row"><label>Fine</label><input id="fine" type="range" min="-100" max="100" value="0"><output id="fineV">+0 ct</output></div>
<div class="pitchBtns"><button data-p="-12">−12</button><button data-p="-7">−7</button><button data-p="-1">−1</button><button data-p="0">0</button><button data-p="1">+1</button><button data-p="7">+7</button><button data-p="12">+12</button></div>
<p><label><input id="tape" type="checkbox"> Tape mode（速度にピッチを追従）</label>　<button id="reset">Reset</button></p></div>
<div class="card grid2"><div><b>Mix / EQ</b>
<div class="row"><label>Volume</label><input id="volume" type="range" min="0" max="1.5" step=".01" value="1"><output id="volumeV">100%</output></div>
<div class="row"><label>Pan</label><input id="pan" type="range" min="-1" max="1" step=".01" value="0"><output id="panV">0</output></div>
<div class="row"><label>Low</label><input id="low" type="range" min="-18" max="18" step=".1" value="0"><output id="lowV">0 dB</output></div>
<div class="row"><label>High</label><input id="high" type="range" min="-18" max="18" step=".1" value="0"><output id="highV">0 dB</output></div></div>
<div><b>Playback / Engine</b>
<div class="row"><label>Loop</label><input id="loop" type="checkbox"><output id="loopV">OFF</output></div>
<div class="row"><label>Preview</label><select id="previewQuality"><option value="35">Fast 35ms</option><option value="55" selected>Normal 55ms</option><option value="80">High 80ms</option></select><output></output></div>
<div class="row"><label>Export</label><select id="exportMethod"><option value="transient" selected>Transient PV</option><option value="phaseLock">Phase-Lock PV</option><option value="wsola">WSOLA</option><option value="granular">Granular</option></select><output></output></div>
<div class="small">Previewは常時リアルタイム。HQ Exportのみ高品質DSPを実行。</div></div></div>
<div class="card"><div class="buttons"><button id="play" class="primary" disabled>▶ Preview</button><button id="stop" disabled>■ Stop</button><button id="export" disabled>⬇ WAV Export</button></div><div class="hint" style="margin-top:8px">速度・ピッチ変更ではRenderingしません。Export時だけレンダリングします。</div></div>
</main>
<script>
const $=id=>document.getElementById(id);let ctx,buffer,node,graph,timer;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pr=()=>Math.pow(2,(+$('pitch').value + +$('fine').value/100)/12);
const worklet=`class P extends AudioWorkletProcessor{constructor(){super();this.c=[];this.n=0;this.pos=0;this.speed=1;this.pitch=1;this.loop=false;this.g=2646;this.h=882;this.on=false;this.port.onmessage=e=>{let m=e.data;if(m.t==='buf'){this.c=m.c.map(x=>new Float32Array(x));this.n=this.c[0]?.length||0;this.pos=0;this.on=true}else if(m.t==='p'){Object.assign(this,m)}else if(m.t==='stop')this.on=false}}process(_,o){let L=o[0][0],R=o[0][1]||L;if(!this.on||!this.n){L.fill(0);if(R!==L)R.fill(0);return true}let N=this.n,g=this.g,s=this.speed,p=this.pitch,h=this.h;for(let i=0;i<L.length;i++){let y=0,z=0,w=0,base=Math.floor(this.pos/h)*h;for(let k=-3;k<=0;k++){let gs=base+k*h,loc=this.pos-gs;if(loc<0||loc>=g)continue;let q=gs*s+(loc-g*.5)*p;if(this.loop)q=((q%N)+N)%N;if(q<0||q>=N-1)continue;let a=q|0,f=q-a,ww=.5-.5*Math.cos(6.2831853*loc/(g-1)),l=this.c[0][a]*(1-f)+this.c[0][a+1]*f,r=this.c[1]?this.c[1][a]*(1-f)+this.c[1][a+1]*f:l;y+=l*ww;z+=r*ww;w+=ww}L[i]=w?y/Math.max(.7,w):0;R[i]=w?z/Math.max(.7,w):0;this.pos++}return true}}registerProcessor('p',P);`;
async function init(){ctx??=new AudioContext();if(ctx.state==='suspended')await ctx.resume();if(!ctx._as){let u=URL.createObjectURL(new Blob([worklet],{type:'text/javascript'}));await ctx.audioWorklet.addModule(u);URL.revokeObjectURL(u);ctx._as=1}}
async function decode(f){stop();$('status').textContent='Reading…';try{await init();let b=await f.arrayBuffer();$('status').textContent='Decoding…';buffer=await ctx.decodeAudioData(b.slice(0));$('status').textContent=`Ready • ${buffer.duration.toFixed(2)} sec • ${buffer.sampleRate} Hz • ${buffer.numberOfChannels}ch`;draw();$('play').disabled=$('stop').disabled=$('export').disabled=false}catch(e){buffer=null;$('status').textContent='Decode failed: '+e.message;$('play').disabled=$('stop').disabled=$('export').disabled=true}}
function draw(){if(!buffer)return;let c=$('wave'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=155*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,155);let a=buffer.getChannelData(0),step=Math.max(1,a.length/r.width|0);x.beginPath();for(let i=0;i<r.width;i++){let s=i*step,e=Math.min(a.length,s+step),mn=1,mx=-1;for(let j=s;j<e;j++){mn=Math.min(mn,a[j]);mx=Math.max(mx,a[j])}x.moveTo(i,77+mn*62);x.lineTo(i,77+mx*62)}x.strokeStyle='#adb5bf';x.stroke()}
function mix(){if(!graph)return;graph.g.gain.value=+$('volume').value;graph.p.pan.value=+$('pan').value;graph.l.gain.value=+$('low').value;graph.h.gain.value=+$('high').value}
function send(){if(!node)return;let g=Math.round(ctx.sampleRate*(+$('previewQuality').value)/1000);node.port.postMessage({t:'p',speed:+$('speed').value,pitch:$('tape').checked?+$('speed').value:pr(),loop:$('loop').checked,g,h:Math.max(64,g/3|0)})}
function labels(){for(let id of ['speed','pitch','fine','volume','pan','low','high']){}$('speedV').textContent=(+$('speed').value).toFixed(2)+'×';$('pitchV').textContent=(+$('pitch').value>=0?'+':'')+(+$('pitch').value).toFixed(2)+' st';$('fineV').textContent=(+$('fine').value>=0?'+':'')+$('fine').value+' ct';$('volumeV').textContent=Math.round(+$('volume').value*100)+'%';$('panV').textContent=(+$('pan').value>=0?'+':'')+(+$('pan').value).toFixed(2);$('lowV').textContent=(+$('low').value>=0?'+':'')+(+$('low').value).toFixed(1)+' dB';$('highV').textContent=(+$('high').value>=0?'+':'')+(+$('high').value).toFixed(1)+' dB';$('loopV').textContent=$('loop').checked?'ON':'OFF';send();mix()}
function stop(msg=true){clearTimeout(timer);if(node){try{node.port.postMessage({t:'stop'})}catch{}try{node.disconnect()}catch{}node=null}if(graph){try{graph.l.disconnect()}catch{}graph=null}if(msg&&buffer)$('status').textContent=`Ready • ${buffer.duration.toFixed(2)} sec • ${buffer.sampleRate} Hz • ${buffer.numberOfChannels}ch`}
async function preview(){if(!buffer)return;await init();stop(false);node=new AudioWorkletNode(ctx,'p',{outputChannelCount:[2]});let l=ctx.createBiquadFilter(),h=ctx.createBiquadFilter(),g=ctx.createGain(),p=ctx.createStereoPanner();l.type='lowshelf';l.frequency.value=180;h.type='highshelf';h.frequency.value=4500;node.connect(l).connect(h).connect(g).connect(p).connect(ctx.destination);graph={l,h,g,p};let c=[];for(let i=0;i<buffer.numberOfChannels;i++){let a=new Float32Array(buffer.getChannelData(i));c.push(a.buffer)}if(c.length===1)c.push(c[0].slice(0));node.port.postMessage({t:'buf',c},c);send();mix();$('status').textContent='Preview — realtime';if(!$('loop').checked)timer=setTimeout(stop,buffer.duration/+ $('speed').value*1000+200)}
async function hq(){if(!buffer)return null;$('progress').style.width='0%';let {transient,phaseLock}=await import('https://esm.sh/@audio/stretch@1.1.4');let {pitchShift}=await import('https://esm.sh/@audio/shift@1.1.4');let ch=[];for(let i=0;i<buffer.numberOfChannels;i++)ch.push(new Float32Array(buffer.getChannelData(i)));let factor=1/+ $('speed').value;let method=$('exportMethod').value;let stretched;if(method==='wsola'){let {wsola}=await import('https://esm.sh/@audio/stretch-wsola@1.1.4');stretched=wsola(ch,{factor,sampleRate:buffer.sampleRate})}else if(method==='phaseLock'){stretched=phaseLock(ch,{factor,sampleRate:buffer.sampleRate})}else if(method==='transient'){stretched=transient(ch,{factor,sampleRate:buffer.sampleRate})}else{stretched=ch}let pitched=$('tape').checked?stretched:pitchShift(stretched,{semitones:+$('pitch').value + +$('fine').value/100,method:method==='wsola'?'wsola':method==='phaseLock'?'phaseLock':'transient',sampleRate:buffer.sampleRate});if($('tape').checked)return pitched;return pitched}
function toBuf(ch){let arr=Array.isArray(ch)?ch:[ch],n=arr[0].length,b=ctx.createBuffer(arr.length,n,buffer.sampleRate);arr.forEach((a,i)=>b.copyToChannel(a,i));return b}
function wav(b){let n=b.length,ch=b.numberOfChannels,sr=b.sampleRate,v=new DataView(new ArrayBuffer(44+n*ch*2)),o=0;let ws=s=>{for(let c of s)v.setUint8(o++,c.charCodeAt(0))},u16=x=>{v.setUint16(o,x,true);o+=2},u32=x=>{v.setUint32(o,x,true);o+=4};ws('RIFF');u32(36+n*ch*2);ws('WAVEfmt ');u32(16);u16(1);u16(ch);u32(sr);u32(sr*ch*2);u16(ch*2);u16(16);ws('data');u32(n*ch*2);for(let i=0;i<n;i++)for(let c=0;c<ch;c++){let x=clamp(b.getChannelData(c)[i],-1,1);v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return new Blob([v.buffer],{type:'audio/wav'})}
async function exportWav(){if(!buffer)return;stop();$('export').disabled=true;$('status').textContent='HQ Rendering…';try{let ch=await hq(),b=toBuf(ch),url=URL.createObjectURL(wav(b)),a=document.createElement('a');a.href=url;a.download='AudioShift.wav';a.click();$('status').textContent=`Exported • ${b.duration.toFixed(2)} sec`;$('progress').style.width='100%';setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){console.error(e);$('status').textContent='HQ export failed: '+e.message}finally{$('export').disabled=false}}
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&decode(e.target.files[0]);['dragenter','dragover'].forEach(x=>$('drop').addEventListener(x,e=>{e.preventDefault();$('drop').classList.add('over')}));['dragleave','drop'].forEach(x=>$('drop').addEventListener(x,e=>{e.preventDefault();$('drop').classList.remove('over')}));$('drop').ondrop=e=>{let f=e.dataTransfer.files[0];if(f)decode(f)};
$('play').onclick=preview;$('stop').onclick=()=>stop();$('export').onclick=exportWav;$('reset').onclick=()=>{$('speed').value=1;$('pitch').value=0;$('fine').value=0;$('volume').value=1;$('pan').value=0;$('low').value=0;$('high').value=0;$('tape').checked=false;labels()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('pitch').value=b.dataset.p;$('fine').value=0;labels()});document.querySelectorAll('input,select').forEach(e=>e.oninput=labels);addEventListener('resize',draw);labels();
</script></body></html>
